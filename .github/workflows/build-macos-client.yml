name: Build macOS Clients

on:
  workflow_dispatch:
    inputs:
      arm64_test_only:
        description: Build only the temporary Apple Silicon validation artifact
        required: true
        default: false
        type: boolean
      source_sha:
        description: Exact committed source SHA to build
        required: true
        default: 4b2833bd9d6c797d459cba72bf4a9949d1d1d9d2
        type: string

permissions:
  contents: read

env:
  FROZEN_RELEASE_SHA: 4b2833bd9d6c797d459cba72bf4a9949d1d1d9d2
  PRODUCT_VERSION: 2.0.0
  FROZEN_PRODUCT_ROOT: frozen-src
  PYTHON_SOURCE_VERSION: 3.12.11
  SQLITE_SOURCE_VERSION: 3.51.3
  MACOSX_DEPLOYMENT_TARGET: "14.0"

jobs:
  build-macos-client:
    name: Build ${{ matrix.arch }} macOS ${{ matrix.target_min_macos }}+ client
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 50
    strategy:
      fail-fast: false
      matrix:
        # A static include entry creates an extra job even when the base axis omits
        # that architecture. Select the complete include list instead.
        include: ${{ fromJSON(inputs.arm64_test_only && '[{"arch":"arm64","runner":"macos-14","target_min_macos":"14","build_argument":"","source_dmg":"release/KOLConnect_v2.0.0_mac_arm64.dmg","target_dmg":"release/KOLConnect_v2.0.0_macOS_arm64.dmg","artifact_name":"KOLConnect-v2.0.0-macOS-arm64","app_path":"packaging/.pyinstaller-dist-macos/KOLConnect.app"}]' || '[{"arch":"arm64","runner":"macos-14","target_min_macos":"14","build_argument":"","source_dmg":"release/KOLConnect_v2.0.0_mac_arm64.dmg","target_dmg":"release/KOLConnect_v2.0.0_macOS_arm64.dmg","artifact_name":"KOLConnect-v2.0.0-macOS-arm64","app_path":"packaging/.pyinstaller-dist-macos/KOLConnect.app"},{"arch":"x86_64","runner":"macos-15-intel","target_min_macos":"14","build_argument":"x86_64","source_dmg":"release/KOLConnect_v2.0.0_mac_intel.dmg","target_dmg":"release/KOLConnect_v2.0.0_macOS_x64.dmg","artifact_name":"KOLConnect-v2.0.0-macOS-x64","app_path":"dist/pyinstaller-macos-intel/KOLConnect.app"}]') }}
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
      TARGET_ARCH: ${{ matrix.arch }}
      BUILD_ARGUMENT: ${{ matrix.build_argument }}
      SOURCE_DMG: ${{ matrix.source_dmg }}
      TARGET_DMG: ${{ inputs.arm64_test_only && 'release/KOLConnect_v2.0.0_macOS_arm64_TEST.dmg' || matrix.target_dmg }}
      ARTIFACT_NAME: ${{ inputs.arm64_test_only && 'KOLConnect-v2.0.0-macOS-arm64-TEST' || matrix.artifact_name }}
      APP_PATH: ${{ matrix.app_path }}
      TARGET_MIN_MACOS: ${{ matrix.target_min_macos }}
      EXPECTED_SOURCE_SHA: ${{ inputs.arm64_test_only && inputs.source_sha || '4b2833bd9d6c797d459cba72bf4a9949d1d1d9d2' }}
      TEST_BUILD: ${{ inputs.arm64_test_only && 'true' || 'false' }}
    steps:
      - name: Check out workflow infrastructure from latest main
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.arm64_test_only && inputs.source_sha || 'main' }}
          fetch-depth: 1

      - name: Check out frozen application source separately
        uses: actions/checkout@v4
        with:
          ref: ${{ inputs.arm64_test_only && inputs.source_sha || '4b2833bd9d6c797d459cba72bf4a9949d1d1d9d2' }}
          path: frozen-src
          fetch-depth: 1

      - name: Enforce selected source revision
        shell: bash
        run: |
          set -euo pipefail
          actual_sha="$(git -C "${FROZEN_PRODUCT_ROOT}" rev-parse HEAD)"
          [[ "${EXPECTED_SOURCE_SHA}" =~ ^[0-9a-f]{40}$ ]] || { echo "source_sha must be a full commit SHA." >&2; exit 1; }
          echo "EXPECTED_SOURCE_SHA=${EXPECTED_SOURCE_SHA}"
          echo "ACTUAL_BUILD_SHA=${actual_sha}"
          [[ "${actual_sha}" == "${EXPECTED_SOURCE_SHA}" ]] || { echo "Selected source revision mismatch." >&2; exit 1; }
          echo "ACTUAL_BUILD_SHA=${actual_sha}" >> "${GITHUB_ENV}"

      - name: Build job-local SQLite 3.51.3 and Python 3.12
        shell: bash
        run: |
          set -euo pipefail
          sqlite_prefix="${RUNNER_TEMP}/kolconnect-sqlite"
          python_prefix="${RUNNER_TEMP}/kolconnect-python"
          work="${RUNNER_TEMP}/kolconnect-toolchain"
          mkdir -p "${work}"; cd "${work}"
          curl --fail --location --retry 3 --output sqlite.tar.gz "https://www.sqlite.org/2026/sqlite-autoconf-3510300.tar.gz"
          tar -xzf sqlite.tar.gz; cd sqlite-autoconf-3510300
          CFLAGS="-arch ${TARGET_ARCH} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}" ./configure --prefix="${sqlite_prefix}" --disable-shared --enable-static
          make -j2; make install
          cd "${work}"
          curl --fail --location --retry 3 --output python.tgz "https://www.python.org/ftp/python/${PYTHON_SOURCE_VERSION}/Python-${PYTHON_SOURCE_VERSION}.tgz"
          tar -xzf python.tgz; cd "Python-${PYTHON_SOURCE_VERSION}"
          export CPPFLAGS="-I${sqlite_prefix}/include"
          export LDFLAGS="-L${sqlite_prefix}/lib"
          export PKG_CONFIG_PATH="${sqlite_prefix}/lib/pkgconfig"
          export CFLAGS="-arch ${TARGET_ARCH} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          export LDFLAGS="${LDFLAGS} -arch ${TARGET_ARCH} -mmacosx-version-min=${MACOSX_DEPLOYMENT_TARGET}"
          ./configure --prefix="${python_prefix}" --with-ensurepip=install --enable-shared
          make -j2; make install
          ln -sf python3 "${python_prefix}/bin/python"
          echo "${python_prefix}/bin" >> "${GITHUB_PATH}"
          echo "CUSTOM_PYTHON_PREFIX=${python_prefix}" >> "${GITHUB_ENV}"
          echo "SQLITE_BUILD_PREFIX=${sqlite_prefix}" >> "${GITHUB_ENV}"

      - name: Validate native build runtime
        shell: bash
        run: |
          set -euo pipefail
          [[ "$(uname -m)" == "${TARGET_ARCH}" ]]; command -v python3
          [[ "$(command -v python3)" == "${CUSTOM_PYTHON_PREFIX}/bin/python3" ]]
          [[ "$(command -v python)" == "${CUSTOM_PYTHON_PREFIX}/bin/python" ]]
          python3 -c 'import sys, sqlite3, _sqlite3; print(sys.executable); print(sys.version); print(sqlite3.sqlite_version); print(_sqlite3.__file__)'
          [[ "$(python3 -c 'import platform; print(platform.machine())')" == "${TARGET_ARCH}" ]]
          [[ "$(python3 -c 'import sqlite3; print(sqlite3.sqlite_version)')" == "${SQLITE_SOURCE_VERSION}" ]]
          otool -L "$(python3 -c 'import _sqlite3; print(_sqlite3.__file__)')"
          shared_python="${CUSTOM_PYTHON_PREFIX}/lib/libpython3.12.dylib"
          test -f "${shared_python}"
          file "${shared_python}"; lipo -info "${shared_python}"; otool -L "${shared_python}"
          [[ "$(lipo -archs "${shared_python}")" == "${TARGET_ARCH}" ]]
          shared_minos="$(otool -l "${shared_python}" | awk '$1 == "cmd" { command = $2; next } command == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit } command == "LC_VERSION_MIN_MACOSX" && $1 == "version" { print $2; exit }')"
          [[ "${shared_minos}" == "${MACOSX_DEPLOYMENT_TARGET}" ]]
          python3 "${FROZEN_PRODUCT_ROOT}/scripts/check_sqlite_runtime.py"
          echo "PYTHON_VERSION=$(python3 --version 2>&1)" >> "${GITHUB_ENV}"

      - name: Install packaging dependencies
        working-directory: frozen-src
        shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install -r packaging/requirements-build.txt
          pyinstaller_version="$(python3 -c 'import PyInstaller; print(PyInstaller.__version__)')"
          python3 -m pip uninstall --yes PyInstaller
          PYINSTALLER_COMPILE_BOOTLOADER=1 \
          MACOSX_DEPLOYMENT_TARGET="${MACOSX_DEPLOYMENT_TARGET}" \
            python3 -m pip install --verbose --no-cache-dir --no-binary=PyInstaller --no-deps "PyInstaller==${pyinstaller_version}"
          bootloader="$(python3 - <<'PY'
          from pathlib import Path
          from PyInstaller import HOMEPATH, PLATFORM
          print(Path(HOMEPATH) / "PyInstaller" / "bootloader" / PLATFORM / "runw")
          PY
          )"
          test -x "${bootloader}"
          [[ "$(lipo -archs "${bootloader}")" == "${TARGET_ARCH}" ]]
          bootloader_minos="$(otool -l "${bootloader}" | awk '$1 == "cmd" { command = $2; next } command == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit } command == "LC_VERSION_MIN_MACOSX" && $1 == "version" { print $2; exit }')"
          echo "PYINSTALLER_BOOTLOADER=${bootloader}"
          echo "PYINSTALLER_BOOTLOADER_MIN_MACOS=${bootloader_minos}"
          [[ "${bootloader_minos}" == "${MACOSX_DEPLOYMENT_TARGET}" ]]

      - name: Assert v2.0.0 version metadata
        working-directory: frozen-src
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json
          from pathlib import Path
          from app.version import APP_VERSION
          expected = "2.0.0"
          root = Path.cwd()
          manifest = json.loads((root / "chrome_extension" / "manifest.json").read_text(encoding="utf-8"))
          mac_specs = [
              (root / "packaging" / "spec" / "KOLConnect_mac.spec").read_text(encoding="utf-8"),
              (root / "packaging" / "spec" / "KOLConnect_mac_intel.spec").read_text(encoding="utf-8"),
          ]
          assert APP_VERSION == expected
          assert manifest["version"] == expected
          assert manifest["version_name"] == f"KOLConnect v{expected}"
          for spec in mac_specs:
              assert f'"CFBundleShortVersionString": "{expected}"' in spec
              assert f'"CFBundleVersion": "{expected}"' in spec
          PY

      - name: Run macOS release contract tests
        shell: bash
        run: |
          set -euo pipefail
          python3 scripts/run_python_tests.py --pattern test_m2_cross_platform_packaging.py --verbosity 2
          python3 scripts/run_python_tests.py --pattern test_version_consistency.py --verbosity 2
          python3 scripts/run_python_tests.py --pattern test_targeted_gate_d_macos_keychain.py --verbosity 2

      - name: Build native macOS client
        working-directory: frozen-src
        shell: bash
        run: |
          set -euo pipefail
          touch "${RUNNER_TEMP}/kolconnect-macos-build-started"
          [[ "$(command -v python)" == "${CUSTOM_PYTHON_PREFIX}/bin/python" ]]
          python3 -c 'import sys, sqlite3; assert sys.executable.startswith(__import__("os").environ["CUSTOM_PYTHON_PREFIX"]); assert sqlite3.sqlite_version == "3.51.3"'
          if [[ -n "${BUILD_ARGUMENT}" ]]; then bash packaging/build_macos.sh "${BUILD_ARGUMENT}"; else bash packaging/build_macos.sh; fi
          test -s "${SOURCE_DMG}"
          rm -f "${SOURCE_DMG}"

      - name: Verify macOS deployment targets and packaged resources
        shell: bash
        run: |
          set -euo pipefail
          app="${FROZEN_PRODUCT_ROOT}/${APP_PATH}"
          binary="${app}/Contents/MacOS/KOLConnect"
          plist="${app}/Contents/Info.plist"
          test -d "${app}"; test -x "${binary}"; test -f "${plist}"
          extract_macos_minimum() {
            # LC_BUILD_VERSION uses "minos"; older x86_64 binaries use
            # LC_VERSION_MIN_MACOSX and report the deployment floor as "version".
            # The current Intel app reports version 10.13 (with SDK 15.4), which
            # is within the macOS 14 compatibility ceiling.
            # SDK values are intentionally ignored in both forms.
            otool -l "$1" | awk '
              $1 == "cmd" { command = $2; next }
              command == "LC_BUILD_VERSION" && $1 == "minos" { print $2; exit }
              command == "LC_VERSION_MIN_MACOSX" && $1 == "version" { print $2; exit }
            '
          }
          is_macos_target_compatible() {
            awk -v candidate="$1" -v ceiling="${TARGET_MIN_MACOS}" '
              BEGIN {
                count = split(candidate, parts, ".")
                if (count < 1 || parts[1] !~ /^[0-9]+$/) exit 1
                major = parts[1] + 0
                minor = count > 1 ? parts[2] + 0 : 0
                patch = count > 2 ? parts[3] + 0 : 0
                exit !(major < ceiling || (major == ceiling && minor == 0 && patch == 0))
              }
            '
          }
          inspect_macos_binary() {
            local label="$1" target="$2" expected_arch="$3" file_info lipo_info arches minos
            file_info="$(file "${target}")"
            lipo_info="$(lipo -info "${target}")"
            arches="$(lipo -archs "${target}")"
            minos="$(extract_macos_minimum "${target}")"
            echo "${label}_FILE=${file_info}"
            echo "${label}_LIPO_INFO=${lipo_info}"
            echo "${label}_ARCHITECTURES=${arches}"
            echo "${label}_MIN_MACOS=${minos}"
            [[ "${arches}" == "${expected_arch}" ]]
            [[ -n "${minos}" ]] || { echo "No supported macOS deployment load command found." >&2; return 1; }
            is_macos_target_compatible "${minos}"
            [[ "${minos}" == "${MACOSX_DEPLOYMENT_TARGET}" ]] || {
              echo "${label} deployment target ${minos} does not match ${MACOSX_DEPLOYMENT_TARGET}." >&2
              return 1
            }
          }
          inspect_macos_binary APP "${binary}" "${TARGET_ARCH}"
          pyexpat="$(find "${app}/Contents" -name 'pyexpat.cpython-312-darwin.so' -print -quit)"
          test -n "${pyexpat}"
          inspect_macos_binary PYEXPAT "${pyexpat}" "${TARGET_ARCH}"
          sqlite_module="$(find "${app}/Contents" -name '_sqlite3.cpython-312-darwin.so' -print -quit)"
          test -n "${sqlite_module}"; inspect_macos_binary SQLITE_MODULE "${sqlite_module}" "${TARGET_ARCH}"
          ! otool -L "${sqlite_module}" | grep -Fq "${RUNNER_TEMP}"
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${plist}")" == "${PRODUCT_VERSION}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleVersion' "${plist}")" == "${PRODUCT_VERSION}" ]]
          webapp_index="$(find "${app}/Contents" -path '*/webapp/index.html' -print -quit)"
          webapp_root="$(dirname "${webapp_index}")"
          test -n "${webapp_index}"; test -f "${webapp_root}/app.js"; test -f "${webapp_root}/styles.css"; test -f "${webapp_root}/i18n.js"
          grep -Fq 'FEISHU_FIELD_FETCH_FAILED' "${webapp_root}/pages/settings.js"
          grep -Fq 'settingsFeishuFieldFetchFailed' "${webapp_root}/i18n.js"
          grep -Fq 'class FieldFetchResult' "${FROZEN_PRODUCT_ROOT}/app/feishu_client.py"
          grep -Fq 'FEISHU_FIELD_FETCH_FAILED' "${FROZEN_PRODUCT_ROOT}/app/services/feishu_sync_service.py"
          grep -Fq '"requests", "certifi"' "${FROZEN_PRODUCT_ROOT}/packaging/spec/KOLConnect_mac.spec"
          archive_listing="$(pyi-archive_viewer -l "${binary}")"
          grep -Fq 'feishu_client' <<<"${archive_listing}"
          grep -Fq 'services.feishu_sync_service' <<<"${archive_listing}"
          find "${app}/Contents" -path '*/assets/KOLConnect.png' -print -quit | grep -q .
          find "${app}/Contents" -path '*/chrome_extension/manifest.json' -print -quit | grep -q .
          find "${app}/Contents" -path '*/chrome_extension/tests' -exec rm -rf {} +
          find "${app}/Contents" -path '*/chrome_extension/README.md' -delete
          ! find "${app}/Contents" -path '*/chrome_extension/tests' -print -quit | grep -q .
          ! find "${app}/Contents" -path '*/chrome_extension/README.md' -print -quit | grep -q .
          "${binary}" --sqlite-runtime-check
          codesign --force --deep --sign - "${app}"
          codesign --verify --deep --strict --verbose=2 "${app}"

      - name: Smoke test packaged imports and app with isolated HOME
        shell: bash
        run: |
          set -euo pipefail
          app="${FROZEN_PRODUCT_ROOT}/${APP_PATH}"; binary="${app}/Contents/MacOS/KOLConnect"
          smoke_root="$(mktemp -d "${RUNNER_TEMP}/kolconnect-smoke.XXXXXX")"
          smoke_home="${smoke_root}/home"; smoke_tmp="${smoke_root}/tmp"; stdout_log="${smoke_root}/stdout.log"; stderr_log="${smoke_root}/stderr.log"
          mkdir -p "${smoke_home}" "${smoke_tmp}"
          app_pid=""
          cleanup_smoke() { if [[ -n "${app_pid}" ]] && kill -0 "${app_pid}" 2>/dev/null; then osascript -e 'tell application id "com.kolconnect.app" to quit' >/dev/null 2>&1 || true; kill -TERM "${app_pid}" 2>/dev/null || true; wait "${app_pid}" 2>/dev/null || true; fi; }
          trap cleanup_smoke EXIT
          ! curl --silent --max-time 2 http://127.0.0.1:8765/ >/dev/null 2>&1
          HOME="${smoke_home}" TMPDIR="${smoke_tmp}" "${binary}" >"${stdout_log}" 2>"${stderr_log}" & app_pid=$!
          server_ready=0
          for _ in $(seq 1 90); do
            kill -0 "${app_pid}" 2>/dev/null || { cat "${stdout_log}" "${stderr_log}" >&2; exit 1; }
            if curl --fail --silent --show-error --max-time 2 http://127.0.0.1:8765/ -o "${smoke_root}/index.html"; then server_ready=1; break; fi
            sleep 1
          done
          [[ "${server_ready}" == "1" ]]
          # Server startup imports openpyxl, which loads ElementTree and pyexpat.
          grep -Fq "KOLConnect" "${smoke_root}/index.html"
          curl --fail --silent --show-error --max-time 5 http://127.0.0.1:8765/pages/dashboard.js -o "${smoke_root}/dashboard.js"
          test -s "${smoke_root}/dashboard.js"
          test -f "${smoke_home}/Library/Application Support/KOLConnect/data/kolconnect.db"
          ! grep -Eiq 'Traceback \(most recent call last\)|Fatal Python error|Failed to execute script|pyexpat' "${stdout_log}" "${stderr_log}"
          echo "PACKAGED_EXPAT_SMOKE=PASS"
          echo "PACKAGED_ELEMENTTREE_SMOKE=PASS"
          echo "PACKAGED_OPENPYXL_SMOKE=PASS"
          echo "PACKAGED_APP_LAUNCH=PASS"

      - name: Create final macOS DMG
        shell: bash
        run: |
          set -euo pipefail
          dmg_stage="$(mktemp -d "${RUNNER_TEMP}/kolconnect-dmg-stage.XXXXXX")"
          trap 'rm -rf "${dmg_stage}"' EXIT
          ditto "${FROZEN_PRODUCT_ROOT}/${APP_PATH}" "${dmg_stage}/KOLConnect.app"
          ln -s /Applications "${dmg_stage}/Applications"
          product_dmg="${FROZEN_PRODUCT_ROOT}/${TARGET_DMG}"
          rm -f "${product_dmg}"
          hdiutil create -volname "KOLConnect v2.0.0" -srcfolder "${dmg_stage}" -ov -format UDZO "${product_dmg}"

      - name: Validate DMG and calculate SHA-256
        shell: bash
        run: |
          set -euo pipefail
          product_dmg="${FROZEN_PRODUCT_ROOT}/${TARGET_DMG}"
          test -s "${product_dmg}"
          test "${product_dmg}" -nt "${RUNNER_TEMP}/kolconnect-macos-build-started"
          mount_dir="$(mktemp -d "${RUNNER_TEMP}/kolconnect-dmg.XXXXXX")"
          trap 'hdiutil detach "${mount_dir}" >/dev/null 2>&1 || true; rmdir "${mount_dir}" >/dev/null 2>&1 || true' EXIT
          hdiutil attach -readonly -nobrowse -mountpoint "${mount_dir}" "${product_dmg}" >/dev/null
          test -d "${mount_dir}/KOLConnect.app"; test -L "${mount_dir}/Applications"
          [[ "$(lipo -archs "${mount_dir}/KOLConnect.app/Contents/MacOS/KOLConnect")" == "${TARGET_ARCH}" ]]
          [[ "$(/usr/libexec/PlistBuddy -c 'Print :CFBundleShortVersionString' "${mount_dir}/KOLConnect.app/Contents/Info.plist")" == "${PRODUCT_VERSION}" ]]
          codesign --verify --deep --strict --verbose=2 "${mount_dir}/KOLConnect.app"
          hdiutil detach "${mount_dir}" >/dev/null
          artifact_size="$(stat -f '%z' "${product_dmg}")"; artifact_sha256="$(shasum -a 256 "${product_dmg}" | awk '{print $1}')"
          [[ "${artifact_size}" -gt 0 ]]
          echo "ARTIFACT_SIZE_BYTES=${artifact_size}" >> "${GITHUB_ENV}"
          echo "ARTIFACT_SHA256=${artifact_sha256}" >> "${GITHUB_ENV}"
          echo "DMG_VALIDATION=PASS"

      - name: Write build summary
        shell: bash
        run: |
          {
            echo "## KOLConnect v2.0.0 macOS ${TARGET_MIN_MACOS}+ ${TARGET_ARCH} $([[ "${TEST_BUILD}" == "true" ]] && echo 'test build' || echo 'release candidate')"
            echo "- Source: ${ACTUAL_BUILD_SHA}"
            echo "- Runner: ${{ matrix.runner }}"
            echo "- Architecture: ${TARGET_ARCH}"
            echo "- Python: ${PYTHON_VERSION}"
            echo "- Minimum macOS: ${TARGET_MIN_MACOS}+ (verified by otool load command)"
            echo "- DMG: ${FROZEN_PRODUCT_ROOT}/$(basename "${TARGET_DMG}")"
            echo "- Actions artifact: ${ARTIFACT_NAME}"
            echo "- Size: ${ARTIFACT_SIZE_BYTES} bytes"
            echo "- SHA-256: ${ARTIFACT_SHA256}"
            echo "- Signing: ad-hoc; notarization: none; Gatekeeper warning expected"
          } >> "${GITHUB_STEP_SUMMARY}"

      - name: Upload macOS build artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: frozen-src/${{ env.TARGET_DMG }}
          if-no-files-found: error
          retention-days: 30
