name: CI

on:
  workflow_dispatch:
  push:
    branches:
      - main
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  test-windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: |
            packaging/requirements.txt
            packaging/requirements-build.txt
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run Python tests
        id: python_tests
        run: python scripts/run_python_tests.py --verbosity 1
      - name: Run extension tests
        id: extension_tests
        run: node tests/run_extension_tests.js
      - name: Check Python syntax
        run: >-
          python -c "from pathlib import Path; files=[*Path('app').glob('*.py'), *Path('tests').glob('test_*.py'), *Path('scripts').glob('*.py')]; [compile(p.read_text(encoding='utf-8-sig'), str(p), 'exec') for p in files]; print(f'Python syntax passed: {len(files)} files')"
      - name: Check extension JavaScript syntax
        run: node tests/run_extension_tests.js --syntax
      - name: Validate extension manifest
        run: python -c "import json; from pathlib import Path; p=Path('chrome_extension/manifest.json'); json.loads(p.read_text(encoding='utf-8')); print('Manifest JSON passed')"
      - name: Validate specification syntax
        run: >-
          python -c "import ast; from pathlib import Path; files=sorted(Path('packaging/spec').glob('*.spec')); [ast.parse(p.read_text(encoding='utf-8')) for p in files]; print(f'Specification syntax passed: {len(files)} files')"
      - name: Write CI summary
        if: always()
        shell: pwsh
        run: |
          @(
            "## Windows CI"
            ""
            "| Platform | Architecture | Python tests | Extension tests |"
            "|---|---|---|---|"
            "| Windows | ${{ runner.arch }} | ${{ steps.python_tests.outcome }} | ${{ steps.extension_tests.outcome }} |"
          ) | Add-Content -LiteralPath $env:GITHUB_STEP_SUMMARY -Encoding utf8

  test-macos-arm64-keychain:
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    steps:
      - uses: actions/checkout@v4
      - name: Install approved SQLite Python runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install sqlite
          brew upgrade sqlite
          python_install_log="$(mktemp)"
          if brew install python@3.12 2>&1 | tee "${python_install_log}"; then
            :
          elif ! grep -Fq "The formula built, but is not symlinked" "${python_install_log}" || \
               ! grep -Fq "Could not symlink" "${python_install_log}"; then
            exit 1
          fi
          python_prefix="$(brew --prefix python@3.12)"
          python_bin="${python_prefix}/bin/python3.12"
          test -x "${python_bin}"
          "${python_bin}" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "${python_bin}" -m venv .venv-ci
          echo "${PWD}/.venv-ci/bin" >> "${GITHUB_PATH}"
      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          python -c "import platform; print(platform.machine())"
          python -c "import sqlite3; print(f'SQLite runtime: {sqlite3.sqlite_version}')"
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(python -c 'import platform; print(platform.machine())')" == "arm64" ]]
          python scripts/check_sqlite_runtime.py
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Validate native macOS Keychain
        id: native_keychain
        timeout-minutes: 3
        shell: bash
        run: PYTHONUNBUFFERED=1 python -u -m unittest discover -s tests -p 'test_targeted_gate_d_macos_keychain.py' -k native_keychain_round_trip_update_and_delete -v

  test-macos-arm64-python:
    needs: test-macos-arm64-keychain
    runs-on: macos-15
    env:
      HOMEBREW_NO_AUTO_UPDATE: "1"
    timeout-minutes: ${{ matrix.timeout_minutes }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - shard: runtime-http
            timeout_minutes: 30
            patterns: test_m2_*.py,test_m4_*.py,test_m5_*.py,test_phase3_*.py,test_agency_delete_sqlite.py,test_campaign_execution_foundation.py,test_dashboard_v2.py,test_discovery_ux_consolidation.py,test_discovery_workflow_polish.py,test_fx_service.py,test_locale_state_authority.py
          - shard: platform-integrations
            timeout_minutes: 30
            patterns: test_m3_*.py,test_m6_*.py,test_m7_*.py,test_m8_*.py,test_plugin_*.py,test_pre_m9_google_auth_status.py,test_pre_m9_google_sheets_data_sync.py
          - shard: storage-foundation
            timeout_minutes: 30
            patterns: test_pre_m8_*.py,test_data_foundation_phase1.py,test_data_foundation_phase1_6.py,test_m1_b1_c1.py,test_m1_c2_bio_archived_columns.py
          - shard: mail-followup-core
            timeout_minutes: 30
            patterns: test_mail_followup_gate2.py,test_mail_followup_gate3.py,test_mail_followup_gate4.py,test_mail_followup_gate5.py
          - shard: mail-security-native
            timeout_minutes: 30
            patterns: test_mail_followup_google_sheets_replica.py,test_mail_followup_ui_api.py,test_targeted_gate_b_observability.py,test_targeted_gate_c_mail_secret_storage.py,test_targeted_gate_c1_mail_sync_redaction.py,test_targeted_gate_d_macos_keychain.py
          - shard: product-contracts
            timeout_minutes: 20
            patterns: test_phase4_*.py,test_pre_cloud_product_cleanup.py,test_pre_m9_browser_mode_retirement.py,test_pre_m9_email_deduplication.py,test_release_critical_fixes.py,test_test_artifact_hygiene.py,test_uuid7_compatibility.py,test_v2_*.py,test_version_consistency.py
    steps:
      - uses: actions/checkout@v4
      - name: Install approved SQLite Python runtime
        shell: bash
        run: |
          set -euo pipefail
          brew install sqlite
          brew upgrade sqlite
          python_install_log="$(mktemp)"
          if brew install python@3.12 2>&1 | tee "${python_install_log}"; then
            :
          elif ! grep -Fq "The formula built, but is not symlinked" "${python_install_log}" || \
               ! grep -Fq "Could not symlink" "${python_install_log}"; then
            exit 1
          fi
          python_prefix="$(brew --prefix python@3.12)"
          python_bin="${python_prefix}/bin/python3.12"
          test -x "${python_bin}"
          "${python_bin}" -c 'import sys; assert sys.version_info[:2] == (3, 12)'
          "${python_bin}" -m venv .venv-ci
          echo "${PWD}/.venv-ci/bin" >> "${GITHUB_PATH}"
      - name: Confirm Apple Silicon runner
        shell: bash
        run: |
          set -euo pipefail
          uname -m
          python -c "import platform; print(platform.machine())"
          python -c "import sqlite3; print(f'SQLite runtime: {sqlite3.sqlite_version}')"
          [[ "$(uname -m)" == "arm64" ]]
          [[ "$(python -c 'import platform; print(platform.machine())')" == "arm64" ]]
          python scripts/check_sqlite_runtime.py
      - name: Install dependencies
        run: python -m pip install -r packaging/requirements-build.txt
      - name: Run ${{ matrix.shard }} Python shard
        shell: bash
        run: |
          set -euo pipefail
          IFS=',' read -r -a patterns <<< "${{ matrix.patterns }}"
          for pattern in "${patterns[@]}"; do
            PYTHONUNBUFFERED=1 python -u scripts/run_python_tests.py --pattern "${pattern}" --verbosity 2
          done

  test-macos-arm64-extension-static:
    needs:
      - test-macos-arm64-keychain
      - test-macos-arm64-python
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Run extension tests
        id: extension_tests
        run: node tests/run_extension_tests.js
      - name: Check Python syntax
        run: >-
          python -c "from pathlib import Path; files=[*Path('app').glob('*.py'), *Path('tests').glob('test_*.py'), *Path('scripts').glob('*.py')]; [compile(p.read_text(encoding='utf-8-sig'), str(p), 'exec') for p in files]; print(f'Python syntax passed: {len(files)} files')"
      - name: Check extension JavaScript syntax
        run: node tests/run_extension_tests.js --syntax
      - name: Validate extension manifest
        run: python -c "import json; from pathlib import Path; p=Path('chrome_extension/manifest.json'); json.loads(p.read_text(encoding='utf-8')); print('Manifest JSON passed')"
      - name: Validate specification syntax
        run: >-
          python -c "import ast; from pathlib import Path; files=sorted(Path('packaging/spec').glob('*.spec')); [ast.parse(p.read_text(encoding='utf-8')) for p in files]; print(f'Specification syntax passed: {len(files)} files')"
      - name: Check macOS shell syntax
        shell: bash
        run: |
          set -euo pipefail
          script="$(find packaging -maxdepth 1 -type f -name 'build_*.sh' -print -quit)"
          test -n "${script}"
          bash -n "${script}"
      - name: Write CI summary
        if: always()
        shell: bash
        run: |
          {
            echo "## macOS CI"
            echo
            echo "| Platform | Architecture | Keychain | Python shards | Extension tests |"
            echo "|---|---|---|---|---|"
            echo "| macOS | $(uname -m) | ${{ needs.test-macos-arm64-keychain.result }} | ${{ needs.test-macos-arm64-python.result }} | ${{ steps.extension_tests.outcome }} |"
          } >> "${GITHUB_STEP_SUMMARY}"
