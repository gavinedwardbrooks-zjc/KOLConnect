<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>KOL Connect 插件</title>
    <link rel="stylesheet" href="popup.css">
  </head>
  <body>
    <main class="popup-shell">
      <header>
        <p class="eyebrow">KOL Connect</p>
        <h1>采集当前主页</h1>
        <p class="subtitle">确认后发送到本地 KOL联系助手，进入人工审核流程。</p>
      </header>

      <p id="status" class="status" role="status">正在读取当前页面...</p>

      <form id="capture-form" hidden>
        <label>
          平台
          <input id="platform" type="text" readonly>
        </label>
        <label>
          用户名
          <input id="username" type="text" readonly>
        </label>
        <label>
          达人名称
          <input id="name" type="text" placeholder="可修改">
        </label>
        <label>
          主页 URL
          <input id="profile-url" type="url" readonly>
        </label>
        <label>
          粉丝数
          <input id="follower-count" type="text" placeholder="如 10K、1.2M">
        </label>
        <label>
          简介
          <textarea id="bio" rows="4" placeholder="未读取到时可手动补充"></textarea>
        </label>
        <label>
          任务名称
          <input id="task-name" type="text" placeholder="留空则自动命名">
        </label>

        <details>
          <summary>本地连接设置</summary>
          <label>
            本地 API 地址
            <input id="api-url" type="url" value="http://127.0.0.1:8765/api/tasks/manual">
          </label>
        </details>

        <div class="actions">
          <button id="reload" type="button" class="secondary">重新读取</button>
          <button id="send" type="submit" class="primary">确认并发送</button>
        </div>
      </form>
    </main>
    <script src="popup.js"></script>
  </body>
</html>
